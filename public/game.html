<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Who's that Pokémon</title>

    <!-- Styling -->
    <link rel="preload" href="assets/css/fonts/Pokemon Solid.ttf" as="font" type="font/ttf" crossorigin>
    <link rel="stylesheet" href="assets/css/reset.css">
    <link rel="stylesheet" href="assets/css/base.css">
    <link rel="stylesheet" href="assets/css/game.css">
    <link rel="icon" type="image/x-icon" href="assets/images/favicon.ico">

    <!-- Scripts -->
    <script src="assets/js/pokedex.js" defer></script>
    <script src="assets/js/pokemonGuesser.js" defer></script>
</head>
<body>
    <main>
        <section id="scene">
            <a id="back" href="index.html">← Modes</a>
            <div id="mystery"></div>
        </section>

        <div id="bar">
            <div id="search">
                <input id="guessInput" placeholder="Guess the Pokémon…" autocomplete="off" spellcheck="false"
                       role="combobox" aria-controls="suggestions" aria-expanded="false">
                <ul id="suggestions" role="listbox"></ul>
            </div>
            <div id="balls" role="img"></div>
        </div>

        <div id="result" hidden></div>

        <p id="hint">
            Each guess shows its dex number (↑ the mystery Pokémon is higher, ↓ lower), its types and its abilities.
            Anything shared with the mystery Pokémon lights up green.
        </p>
        <section id="guesses"></section>
    </main>
</body>
</html>
